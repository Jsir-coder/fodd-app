<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云同步配置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .step {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .step-number {
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #667eea;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      margin-right: 10px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 10px;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .info {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
      color: #004085;
    }
    .warning {
      background: #fff3cd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
      color: #856404;
    }
    .token-hint {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 云同步配置向导</h1>

    <div class="step">
      <span class="step-number">1</span>
      <strong>输入 GitHub Token</strong>
      <p style="margin: 10px 0 0 40px; font-size: 14px; color: #666;">
        请输入管理员提供的 GitHub Token
      </p>
      <input type="text" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
      <div class="token-hint">💡 Token 需要有 gist 权限</div>
    </div>

    <div class="step">
      <span class="step-number">2</span>
      <strong>输入共享 Gist ID</strong>
      <p style="margin: 10px 0 0 40px; font-size: 14px; color: #666;">
        请输入管理员提供的 Gist ID（所有用户共享同一个）
      </p>
      <input type="text" id="gistIdInput" placeholder="留空则创建新的（仅管理员）" />
      <div class="token-hint">⚠️ 如果你不是第一个用户，必须输入已有的 Gist ID</div>
    </div>

    <button onclick="setupCloud()" id="setupBtn">🚀 开始配置云同步</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px;">正在配置中...</p>
    </div>

    <div class="status" id="status"></div>

    <div class="warning">
      <strong>⚠️ 重要提示：</strong><br>
      • <strong>第一个用户</strong>：留空 Gist ID，系统会自动创建并显示给你<br>
      • <strong>其他用户</strong>：必须输入第一个用户的 Gist ID，才能共享数据
    </div>

    <div class="info">
      💡 Token 和 Gist ID 会安全地保存在浏览器中
    </div>
  </div>

  <script>
    // 检查是否已保存配置
    const savedToken = localStorage.getItem('gist_token');
    const savedGistId = localStorage.getItem('gist_id');

    if (savedToken) {
      document.getElementById('tokenInput').value = savedToken;
    }
    if (savedGistId) {
      document.getElementById('gistIdInput').value = savedGistId;
    }

    async function setupCloud() {
      const tokenInput = document.getElementById('tokenInput');
      const gistIdInput = document.getElementById('gistIdInput');
      const token = tokenInput.value.trim();
      const gistId = gistIdInput.value.trim();

      if (!token) {
        alert('请输入 GitHub Token');
        tokenInput.focus();
        return;
      }

      if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
        alert('Token 格式不正确，应该以 ghp_ 或 github_pat_ 开头');
        return;
      }

      const loading = document.getElementById('loading');
      const status = document.getElementById('status');
      const setupBtn = document.getElementById('setupBtn');

      loading.style.display = 'block';
      status.style.display = 'none';
      setupBtn.disabled = true;

      try {
        let finalGistId = gistId;

        // 如果没有输入 Gist ID，创建新的（仅第一个用户）
        if (!gistId) {
          const response = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              description: '点菜小程序数据存储（多人共享）',
              public: false,
              files: {
                'food-orders.json': {
                  content: JSON.stringify({}, null, 2)
                }
              }
            })
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || '创建云存储失败');
          }

          const data = await response.json();
          finalGistId = data.id;
        } else {
          // 验证 Gist ID 是否有效
          const response = await fetch(`https://api.github.com/gists/${gistId}`, {
            headers: {
              'Authorization': `token ${token}`,
            }
          });

          if (!response.ok) {
            throw new Error('Gist ID 无效或无权访问');
          }
        }

        // 保存配置
        localStorage.setItem('gist_token', token);
        localStorage.setItem('gist_id', finalGistId);

        // 显示成功信息
        loading.style.display = 'none';
        status.className = 'status success';
        status.style.display = 'block';

        if (!gistId) {
          // 第一个用户 - 显示 Gist ID 供其他人使用
          status.innerHTML = `
            ✅ 配置成功！你是第一个用户<br>
            <small style="display: block; margin-top: 10px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 5px;">
              <strong>请复制以下 Gist ID 分享给其他用户：</strong><br>
              <code style="font-size: 16px; font-weight: bold;">${finalGistId}</code>
            </small>
            <small style="display: block; margin-top: 10px;">
              3秒后自动跳转...
            </small>
          `;
        } else {
          // 其他用户
          status.innerHTML = `
            ✅ 配置成功！已连接到共享数据<br>
            <small style="display: block; margin-top: 10px;">
              3秒后自动跳转...
            </small>
          `;
        }

        // 跳转到主应用
        setTimeout(() => {
          window.location.href = 'index-cloud.html';
        }, 3000);

      } catch (error) {
        loading.style.display = 'none';
        setupBtn.disabled = false;
        status.className = 'status error';
        status.style.display = 'block';
        status.innerHTML = `
          ❌ 配置失败<br>
          <small style="display: block; margin-top: 10px;">
            ${error.message}<br>
            请检查 Token 和 Gist ID 是否正确
          </small>
        `;
      }
    }

    // 检查是否已配置
    window.addEventListener('DOMContentLoaded', () => {
      const gistId = localStorage.getItem('gist_id');
      const gistToken = localStorage.getItem('gist_token');

      if (gistId && gistToken) {
        const status = document.getElementById('status');
        status.className = 'status success';
        status.style.display = 'block';
        status.innerHTML = `
          ✅ 已配置云同步<br>
          <small style="display: block; margin-top: 10px;">
            Gist ID: ${gistId}<br>
            <a href="index-cloud.html" style="color: #667eea; text-decoration: none;">
              点击这里进入应用 →
            </a>
          </small>
        `;
      }
    });

    // 支持回车键提交
    document.getElementById('gistIdInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        setupCloud();
      }
    });
  </script>
</body>
</html>
