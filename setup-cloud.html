<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云同步配置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .step {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .step-number {
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #667eea;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      margin-right: 10px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 10px;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .info {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 14px;
      color: #004085;
    }
    .token-hint {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 云同步配置向导</h1>

    <div class="step">
      <span class="step-number">1</span>
      <strong>输入 GitHub Token</strong>
      <p style="margin: 10px 0 0 40px; font-size: 14px; color: #666;">
        请输入您的 GitHub Personal Access Token
      </p>
      <input type="text" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
      <div class="token-hint">💡 Token 需要有 gist 权限</div>
    </div>

    <div class="step">
      <span class="step-number">2</span>
      <strong>创建云存储</strong>
      <p style="margin: 10px 0 0 40px; font-size: 14px; color: #666;">
        点击下方按钮，自动创建 GitHub Gist 作为云存储
      </p>
    </div>

    <button onclick="setupCloud()" id="setupBtn">🚀 开始配置云同步</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px;">正在配置中...</p>
    </div>

    <div class="status" id="status"></div>

    <div class="info">
      💡 Token 会安全地保存在浏览器中，不会上传到任何服务器
    </div>
  </div>

  <script>
    // 检查是否已保存 token
    const savedToken = localStorage.getItem('gist_token');
    if (savedToken) {
      document.getElementById('tokenInput').value = savedToken;
    }

    async function setupCloud() {
      const tokenInput = document.getElementById('tokenInput');
      const token = tokenInput.value.trim();

      if (!token) {
        alert('请输入 GitHub Token');
        tokenInput.focus();
        return;
      }

      if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
        alert('Token 格式不正确，应该以 ghp_ 或 github_pat_ 开头');
        return;
      }

      const loading = document.getElementById('loading');
      const status = document.getElementById('status');
      const setupBtn = document.getElementById('setupBtn');

      loading.style.display = 'block';
      status.style.display = 'none';
      setupBtn.disabled = true;

      try {
        // 创建 Gist
        const response = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            description: '点菜小程序数据存储',
            public: false,
            files: {
              'food-orders.json': {
                content: JSON.stringify({}, null, 2)
              }
            }
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || '创建云存储失败');
        }

        const data = await response.json();

        // 保存配置
        localStorage.setItem('gist_token', token);
        localStorage.setItem('gist_id', data.id);

        // 显示成功信息
        loading.style.display = 'none';
        status.className = 'status success';
        status.style.display = 'block';
        status.innerHTML = `
          ✅ 配置成功！<br>
          <small style="display: block; margin-top: 10px;">
            Gist ID: ${data.id}<br>
            3秒后自动跳转...
          </small>
        `;

        // 跳转到主应用
        setTimeout(() => {
          window.location.href = 'index-cloud.html';
        }, 3000);

      } catch (error) {
        loading.style.display = 'none';
        setupBtn.disabled = false;
        status.className = 'status error';
        status.style.display = 'block';
        status.innerHTML = `
          ❌ 配置失败<br>
          <small style="display: block; margin-top: 10px;">
            ${error.message}<br>
            请检查 Token 是否正确且有 gist 权限
          </small>
        `;
      }
    }

    // 检查是否已配置
    window.addEventListener('DOMContentLoaded', () => {
      const gistId = localStorage.getItem('gist_id');
      const gistToken = localStorage.getItem('gist_token');

      if (gistId && gistToken) {
        const status = document.getElementById('status');
        status.className = 'status success';
        status.style.display = 'block';
        status.innerHTML = `
          ✅ 已配置云同步<br>
          <small style="display: block; margin-top: 10px;">
            <a href="index-cloud.html" style="color: #667eea; text-decoration: none;">
              点击这里进入应用 →
            </a>
          </small>
        `;
      }
    });

    // 支持回车键提交
    document.getElementById('tokenInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        setupCloud();
      }
    });
  </script>
</body>
</html>
